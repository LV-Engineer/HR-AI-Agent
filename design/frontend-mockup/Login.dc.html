<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    input::placeholder { color: oklch(0.68 0.012 50); }
  </style>
</helmet>

<div style="display:flex; align-items:center; justify-content:center; width:1440px; height:900px; background:oklch(0.98 0.01 60);">

  <div style="width:400px; display:flex; flex-direction:column; align-items:center;">

    <div style="font-family:'Newsreader', serif; font-style:italic; font-weight:600; font-size:30px; color:oklch(0.25 0.02 40); margin-bottom:6px;">Hirelume</div>
    <div style="font-size:13px; font-weight:500; color:oklch(0.55 0.02 45); margin-bottom:40px;">People Analytics</div>

    <div style="width:100%; display:flex; align-items:center; gap:10px; background:oklch(0.96 0.025 30); border:1px solid oklch(0.85 0.05 30); border-radius:10px; padding:12px 16px; margin-bottom:22px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.13 30)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span style="font-size:13px; color:oklch(0.42 0.1 30);">Невірний email або пароль</span>
    </div>

    <div style="width:100%; display:flex; flex-direction:column; gap:16px;">

      <div style="display:flex; flex-direction:column; gap:7px;">
        <label style="font-size:12.5px; font-weight:500; color:oklch(0.4 0.02 45);">Робочий email</label>
        <input type="text" placeholder="ім'я.прізвище@hirelume.dev" style="width:100%; font-family:inherit; font-size:14.5px; color:oklch(0.28 0.02 40); background:white; border:1px solid oklch(0.87 0.012 50); border-radius:10px; padding:12px 15px; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column; gap:7px;">
        <label style="font-size:12.5px; font-weight:500; color:oklch(0.4 0.02 45);">Пароль</label>
        <input type="password" placeholder="••••••••••" style="width:100%; font-family:inherit; font-size:14.5px; color:oklch(0.28 0.02 40); background:white; border:1px solid oklch(0.87 0.012 50); border-radius:10px; padding:12px 15px; outline:none;">
      </div>

      <div style="width:100%; text-align:center; background:oklch(0.55 0.14 40); border-radius:10px; padding:13px; margin-top:8px; cursor:pointer;">
        <span style="font-size:14.5px; font-weight:600; color:white;">Увійти</span>
      </div>

    </div>

    <div style="font-size:12px; color:oklch(0.6 0.015 50); margin-top:28px; text-align:center; line-height:1.6;">
      Доступ надає HR-адміністратор.<br>Проблеми зі входом — звертайтесь у #it-support.
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
