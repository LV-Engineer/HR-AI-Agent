name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    mypy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: agent-service
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - run: uv sync
            - run: uv run mypy

    tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: agent-service
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - run: uv sync
            - run: uv run pytest --cov=. --cov-report=term-missing