name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    agent-service:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: agent-service
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - run: uv sync
            - run: uv run mypy
            - run: uv run pytest --cov=. --cov-report=term-missing

    mcp-server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mcp-server
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - run: uv sync
            - run: uv run mypy
            - run: uv run pytest --cov=app --cov-report=term-missing

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run build
            - run: npm test -- run
